name: Sync To Parent Repository
on: [ push, delete, create ]
jobs:
  hexo-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: git config
        env:
          USER_NAME: 'wangjueya_ci'
          USER_EMAIL: '573711282@qq.com'
        run: |
          git config --global user.name "$USER_NAME"
          git config --global user.email "$USER_EMAIL"
          git config --global core.quotepath false

      - uses: actions/checkout@v4   # 升级到 v4

      - name: Git submodule update & commit
        run: |
          git submodule update --init --recursive
          git submodule update --remote
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "检测到变更，准备提交..."
            git add *
            git commit -m ":construction_worker: [skip ci] Auto Update"
            git push origin master
          else
            echo "无变更，跳过提交"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4   # 升级到 v4
        with:
          node-version: 24.x

      # ---------- pnpm 一体化 ----------
      - name: Setup pnpm and install
        uses: pnpm/action-setup@v6   # 从 v4 升级到 v6
        with:
          version: latest
          run_install: |
            - args: [--no-ignore-scripts]

      # ---------- 修复文章时间 ----------
      - name: Fix post update time
        run: |
          echo "修复自动构建时所有文章更新时间为当前时间问题 | 取git提交时间"
          cd source/_posts
          git ls-tree -r --name-only HEAD | while read filename; do
            echo $filename;
            unixtime=$(git log -1 --format="%at" -- "${filename}");
            touchtime=$(date -d @$unixtime +'%Y%m%d%H%M.%S');
            echo "${filename} --- ${touchtime}"
            touch -t ${touchtime} "${filename}";
          done
          cd ../../

      - name: Hexo deploy
        run: |
          pnpm run clean
          pnpm run deploy